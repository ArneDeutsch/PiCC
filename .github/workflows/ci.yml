name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 20 is not supported: Pi bundles undici 8.x (engines >=22.19),
        # whose worker_threads.markAsUncloneable dependency does not exist on 20.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fast, deterministic unit + offline-integration tests on every matrix leg.
      - name: Unit & integration tests
        run: npm run test:unit

  e2e:
    name: e2e (real Pi CLI + mock model, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Drives the real Pi CLI against a local mock OpenAI server — no network,
      # no subscription. Python-dependent scenarios self-skip if python is absent.
      - name: End-to-end tests
        run: npm run test:e2e
