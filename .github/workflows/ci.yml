name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 20 is not supported: Pi bundles undici 8.x (engines >=22.19),
        # whose worker_threads.markAsUncloneable dependency does not exist on 20.
        node: [22, 24]
    steps:
      # CI follows reviewed movable major tags so routine validation receives compatible action updates.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:all

      - name: Unit tests
        run: npm run test:unit

      - name: Offline integration tests
        run: npm run test:integration

  e2e:
    name: e2e (real Pi CLI + mock model, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build verified runtime and pack exact product once
        id: pack
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/picc-ci-release-$GITHUB_RUN_ID"
          mkdir "$output_dir"
          result="$(node scripts/pack-release.mjs --output-dir "$output_dir" --event manual)"
          node -e 'const v=JSON.parse(process.argv[1]);if(typeof v.tarball!=="string"||typeof v.sha256!=="string")process.exit(1);console.log("tarball="+v.tarball);console.log("sha256="+v.sha256)' "$result" >> "$GITHUB_OUTPUT"

      # Drives the real Pi CLI with local model traffic and no subscription.
      - name: Compiled runtime end-to-end tests
        run: npm run test:e2e:compiled

      - name: Isolated source-fallback end-to-end witness
        run: npm run test:e2e:source-fallback

      # The packaged consumer installs the already-packed bytes from a derived lock in hard-offline
      # mode; package archives come from the preceding repository dependency installation.
      - name: Scripts-disabled packaged end-to-end witness
        env:
          PICC_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm run test:packaged
