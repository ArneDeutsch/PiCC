name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run typecheck:all && npm run test:source
      - name: Capture release context
        id: context
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "event=tag" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "event=manual" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify source identity
        shell: bash
        run: |
          args=(source --event "${{ steps.context.outputs.event }}")
          if [[ "${{ steps.context.outputs.event }}" == "tag" ]]; then
            args+=(--tag "${{ steps.context.outputs.tag }}")
          fi
          node scripts/verify-release.mjs "${args[@]}"
      - name: Pack once
        id: pack
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID"
          mkdir "$output_dir"
          result="$(node scripts/pack-release.mjs --output-dir "$output_dir")"
          node -e 'const p=require("node:path");const v=JSON.parse(process.argv[1]);for(const k of ["tarball","sha256","version"]){if(typeof v[k]!=="string")process.exit(1);console.log(k+"="+v[k])}console.log("filename="+p.basename(v.tarball))' "$result" >> "$GITHUB_OUTPUT"
      - name: Verify packed artifact
        shell: bash
        run: |
          args=(artifact --event "${{ steps.context.outputs.event }}" --tarball "${{ steps.pack.outputs.tarball }}" --expected-sha256 "${{ steps.pack.outputs.sha256 }}")
          if [[ "${{ steps.context.outputs.event }}" == "tag" ]]; then
            args+=(--tag "${{ steps.context.outputs.tag }}")
          fi
          node scripts/verify-release.mjs "${args[@]}"
      - name: Test exact packaged product
        env:
          PICC_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm run test:packaged
      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: picc-release-${{ github.run_id }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: write
    env:
      RELEASE_FILENAME: ${{ needs.package.outputs.filename }}
      RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: picc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/picc-release-${{ github.run_id }}
      - name: Recheck artifact before publication
        run: >-
          node scripts/verify-release.mjs artifact --event tag --tag "$GITHUB_REF_NAME"
          --tarball "$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID/$RELEASE_FILENAME"
          --expected-sha256 "$RELEASE_SHA256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ runner.temp }}/picc-release-${{ github.run_id }}/${{ needs.package.outputs.filename }}
          generate_release_notes: true
      - name: Publish exact artifact to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN is absent; npm publication skipped."
            exit 0
          fi
          node scripts/publish-release.mjs --tarball "$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID/$RELEASE_FILENAME" --expected-sha256 "$RELEASE_SHA256" --event tag --tag "$GITHUB_REF_NAME"
