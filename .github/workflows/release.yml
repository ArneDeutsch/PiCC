name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # Release pins reviewed action commits so publication dependencies stay immutable and auditable.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify tagged commit is contained in current main
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          fetch_args=(--no-tags)
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            fetch_args+=(--unshallow)
          fi
          git -c http.https://github.com/.extraheader= fetch "${fetch_args[@]}" https://github.com/ArneDeutsch/PiCC.git +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify build-free source lanes
        run: npm run typecheck:all && npm run test:unit && npm run test:integration
      - name: Capture release context
        id: context
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "event=tag" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "event=manual" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build verified runtime and pack once
        id: pack
        shell: bash
        env:
          RELEASE_EVENT: ${{ steps.context.outputs.event }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        run: |
          output_dir="$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID"
          mkdir "$output_dir"
          args=(--output-dir "$output_dir" --event "$RELEASE_EVENT")
          if [[ "$RELEASE_EVENT" == "tag" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          result="$(node scripts/pack-release.mjs "${args[@]}")"
          node -e 'const p=require("node:path");const v=JSON.parse(process.argv[1]);for(const k of ["tarball","sha256","version"]){if(typeof v[k]!=="string")process.exit(1);console.log(k+"="+v[k])}console.log("filename="+p.basename(v.tarball))' "$result" >> "$GITHUB_OUTPUT"
      - name: Inspect and hash exact packed artifact
        shell: bash
        env:
          RELEASE_EVENT: ${{ steps.context.outputs.event }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        run: |
          args=(artifact --event "$RELEASE_EVENT" --tarball "${{ steps.pack.outputs.tarball }}" --expected-sha256 "${{ steps.pack.outputs.sha256 }}")
          if [[ "$RELEASE_EVENT" == "tag" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          node scripts/verify-release.mjs "${args[@]}"
      - name: Test exact packaged product
        env:
          PICC_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: npm run test:packaged
      - name: Upload verified release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: picc-release-${{ github.run_id }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_FILENAME: ${{ needs.package.outputs.filename }}
      RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download verified release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: picc-release-${{ github.run_id }}
          path: ${{ runner.temp }}/picc-release-${{ github.run_id }}
      - name: Recheck artifact before publication
        run: >-
          node scripts/verify-release.mjs artifact --event tag --tag "$GITHUB_REF_NAME"
          --tarball "$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID/$RELEASE_FILENAME"
          --expected-sha256 "$RELEASE_SHA256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: ${{ runner.temp }}/picc-release-${{ github.run_id }}/${{ needs.package.outputs.filename }}
          generate_release_notes: true
      - name: Publish exact artifact to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node scripts/publish-release.mjs
          --tarball "$RUNNER_TEMP/picc-release-$GITHUB_RUN_ID/$RELEASE_FILENAME"
          --expected-sha256 "$RELEASE_SHA256" --event tag --tag "$GITHUB_REF_NAME"
