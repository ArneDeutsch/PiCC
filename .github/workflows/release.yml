name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact-name }}
      tarball-name: ${{ steps.names.outputs.tarball-name }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      event: ${{ steps.context.outputs.event }}
      tag: ${{ steps.context.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install source dependencies
        run: npm ci

      - name: Capture release context
        id: context
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "event=tag" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "event=manual" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck:all

      - name: Source and runtime tests
        run: npm run test:source

      - name: Source release preflight
        shell: bash
        run: |
          args=(source --event "${{ steps.context.outputs.event }}")
          if [[ "${{ steps.context.outputs.event }}" == "tag" ]]; then
            args+=(--tag "${{ steps.context.outputs.tag }}")
          fi
          node scripts/verify-release.mjs "${args[@]}"

      - name: Pack release tarball once
        id: pack
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/picc-release-pack-$GITHUB_RUN_ID"
          mkdir "$output_dir"
          result="$(node scripts/pack-release.mjs --output-dir "$output_dir")"
          tarball="$(node -e 'const v=JSON.parse(process.argv[1]); if(typeof v.tarball!=="string") process.exit(1); process.stdout.write(v.tarball)' "$result")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Initial artifact release preflight
        id: artifact
        shell: bash
        run: |
          args=(artifact --event "${{ steps.context.outputs.event }}" --tarball "${{ steps.pack.outputs.tarball }}")
          if [[ "${{ steps.context.outputs.event }}" == "tag" ]]; then
            args+=(--tag "${{ steps.context.outputs.tag }}")
          fi
          result="$(node scripts/verify-release.mjs "${args[@]}")"
          sha256="$(node -e 'const v=JSON.parse(process.argv[1]); if(!/^[a-f0-9]{64}$/.test(v.sha256)) process.exit(1); process.stdout.write(v.sha256)' "$result")"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Packaged-product end-to-end test
        env:
          PICC_TEST_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm run test:packaged

      - name: Capture artifact names
        id: names
        shell: bash
        run: |
          echo "artifact-name=picc-release-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "tarball-name=$(basename "${{ steps.pack.outputs.tarball }}")" >> "$GITHUB_OUTPUT"

      - name: Final artifact release preflight
        shell: bash
        run: |
          args=(artifact --event "${{ steps.context.outputs.event }}" --tarball "${{ steps.pack.outputs.tarball }}" --expected-sha256 "${{ steps.artifact.outputs.sha256 }}")
          if [[ "${{ steps.context.outputs.event }}" == "tag" ]]; then
            args+=(--tag "${{ steps.context.outputs.tag }}")
          fi
          node scripts/verify-release.mjs "${args[@]}"

      - name: Upload inspected release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.names.outputs.artifact-name }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download inspected release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.validate.outputs.artifact-name }}
          path: ${{ runner.temp }}/picc-release

      - name: Verify downloaded artifact before GitHub release
        run: >-
          node scripts/verify-release.mjs identity --event tag --tag "${{ needs.validate.outputs.tag }}"
          --tarball "${{ runner.temp }}/picc-release/${{ needs.validate.outputs.tarball-name }}"
          --expected-sha256 "${{ needs.validate.outputs.sha256 }}"

      - name: Create tagged GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: ${{ runner.temp }}/picc-release/${{ needs.validate.outputs.tarball-name }}
          generate_release_notes: true

      - name: Verify downloaded artifact before npm handoff
        run: >-
          node scripts/verify-release.mjs identity --event tag --tag "${{ needs.validate.outputs.tag }}"
          --tarball "${{ runner.temp }}/picc-release/${{ needs.validate.outputs.tarball-name }}"
          --expected-sha256 "${{ needs.validate.outputs.sha256 }}"

      - name: Optionally publish inspected tarball to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "NPM_TOKEN is absent; npm publication skipped."
            exit 0
          fi
          node scripts/publish-release.mjs \
            --tarball "${{ runner.temp }}/picc-release/${{ needs.validate.outputs.tarball-name }}" \
            --expected-sha256 "${{ needs.validate.outputs.sha256 }}" \
            --event tag --tag "${{ needs.validate.outputs.tag }}"
